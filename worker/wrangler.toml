name = "harbourlah"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Crons (UTC):
#   */10        refresh the board (MPA feeds; Singapore Cruise Centre ferry board only every 30 min), 1 KV write
#   7 */6       refresh reference data: vessel types, location codes, vessel particulars snapshot
[triggers]
crons = ["*/10 * * * *", "7 */6 * * *"]

# Workers KV: the board snapshot plus reference data.
# Create it once with:  npx wrangler kv namespace create BOARD_KV
# then paste the returned id below (replacing the zeros) and commit it.
[[kv_namespaces]]
binding = "BOARD_KV"
id = "b4642f3ae883491e9b6e80568531ed89"

[vars]
# Comma-separated list of origins allowed to call the API ("*" = any).
ALLOWED_ORIGINS = "https://harbourlah.pages.dev"

# Secret (never commit it):  npx wrangler secret put MPA_API_KEY
# For local dev put MPA_API_KEY=... in worker/.dev.vars (git-ignored).
